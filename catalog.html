<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="Ноуток — ноутбуки в наявності. Оберіть модель, оперативну пам’ять, SSD і стан.">
  <title>Ноутбуки в наявності · Ноуток</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="catalog.css?v=1.11.129">
  <script src="catalog.js?v=1.11.129" defer></script>
</head>
<body>
  <header class="catalog-header"><a href="catalog.html" class="catalog-brand" aria-label="Ноуток — каталог"><img src="icon-192.png" width="40" height="40" alt=""><span>ноуток<span class="brand-dot">.</span></span></a><span class="header-note">Ноутбуки для ваших справ</span><div class="catalog-total"><strong id="catalogTotal">—</strong><span>ноутбуків<br>у каталозі</span></div></header>
  <main>
    <section class="catalog-results" aria-label="Ноутбуки">
      <p id="catalogStatus" role="status" aria-live="polite">Завантаження ноутбуків…</p>
      <div class="catalog-mobile-tools">
        <label class="catalog-search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.6"/></svg><input id="catalogSearch" type="search" placeholder="Пошук моделі…" aria-label="Пошук моделі"></label>
      </div>
      <div class="catalog-sort-buttons" role="group" aria-label="Сортування за колонками"><button type="button" data-sort-field="title" aria-pressed="false">Модель <span aria-hidden="true">↕</span></button><div class="catalog-sort-specs"><button type="button" data-sort-field="ram" aria-pressed="false">ОЗУ <span aria-hidden="true">↕</span></button><button type="button" data-sort-field="ssd" aria-pressed="false">SSD <span aria-hidden="true">↕</span></button><button type="button" data-sort-field="condition" aria-pressed="false">Стан <span aria-hidden="true">↕</span></button><button type="button" data-sort-field="photo" aria-pressed="false">Фото <span aria-hidden="true">↕</span></button><button type="button" data-sort-field="price" aria-pressed="false">Ціна <span aria-hidden="true">↕</span></button></div><button id="catalogFiltersToggle" type="button" aria-expanded="false" aria-controls="catalogFilters"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18v3l-7 7v6l-4-2v-4L3 7z"/></svg>Фільтри</button></div>
      <div id="catalogFilters" class="catalog-mobile-tools" hidden>
        <label>ОЗУ<select id="filterRam"><option value="">Усі</option></select></label>
        <label>SSD<select id="filterSsd"><option value="">Усі</option></select></label>
        <label>Стан<select id="filterCondition"><option value="">Будь-який</option><option>Як новий</option><option>9/10</option><option>8/10</option><option>7/10</option></select></label>
        <label class="catalog-photo-filter"><input id="filterPhoto" type="checkbox"> Лише з фото</label>
        <button id="resetCatalogFilters" type="button">Скинути фільтри</button>
      </div>
      <div id="catalogList" aria-busy="true"></div>
    </section>
  </main>
  <dialog id="purchaseDialog" class="purchase-dialog" aria-labelledby="purchaseTitle" aria-describedby="purchaseProduct">
    <div class="purchase-heading"><div><p class="purchase-eyebrow">Обраний ноутбук</p><h2 id="purchaseTitle">Купити ноутбук</h2></div><button id="purchaseClose" type="button" aria-label="Закрити форму покупки">×</button></div>
    <p id="purchaseProduct" class="purchase-product"></p>
    <form id="purchaseForm">
      <label for="purchaseName">ПІБ<input id="purchaseName" name="fullName" autocomplete="name" placeholder="Прізвище Ім’я По батькові" maxlength="150" required autofocus></label>
      <label for="purchasePhone">Номер телефона<input id="purchasePhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 XX XXX XX XX" maxlength="25" required></label>
      <label for="purchaseCity">Місто отримувача<input id="purchaseCity" name="city" autocomplete="address-level2" placeholder="Наприклад, Київ" maxlength="100" required></label>
      <label for="purchaseBranch">Відділення Нової пошти<input id="purchaseBranch" name="branch" placeholder="Номер або адреса відділення" maxlength="200" required></label>
      <label for="purchasePrice">Ваша ціна в гривнях<div class="purchase-price-input"><input id="purchasePrice" name="offerPrice" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Введіть вашу ціну" required><span aria-hidden="true">₴</span></div></label>
      <p class="purchase-hint">Після заповнення відкриється Telegram із готовим повідомленням. Натисніть «Надіслати» в чаті, щоб передати заявку продавцю.</p>
      <button id="purchaseSubmit" class="purchase-submit" type="submit">Продовжити в Telegram <span aria-hidden="true">↗</span></button>
      <p id="purchaseFeedback" class="purchase-feedback" role="status" hidden></p>
    </form>
  </dialog>
</body>
</html>
